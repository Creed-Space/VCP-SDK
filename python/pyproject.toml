[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-context-protocol"
version = "4.2.0"
description = "Project-maintained implementation of the Value Context Protocol for portable, verifiable context"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Nell Watson"},
    {name = "Claude", email = "noreply@anthropic.com"}
]
maintainers = [
    {name = "Nell Watson"}
]
keywords = ["becoming-minds", "context", "protocol", "safety", "values"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.12.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.1",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.31.1",
    "redis>=4.5.0",
]
redis = [
    "redis>=4.5.0",
]
metrics = [
    "prometheus-client>=0.20.0",
]
mcp = [
    "mcp>=2.0.0,<3",
    "jsonschema>=4.20.0",
]
dev = [
    "build>=1.3.0",
    "twine==7.0.0",
    "pip-audit>=2.9.0",
    "uv==0.12.9",
    "prometheus-client>=0.20.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov==7.1.0",
    "httpx>=0.24.0",
    "jsonschema>=4.20.0",
    "hypothesis==6.167.1",
    "redis>=4.5.0",
    "mypy>=1.0.0",
    "mutmut==3.7.0",
    "pip>=26.2.1",
    "ruff>=0.1.0",
    "types-jsonschema>=4.20.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
vcp = "vcp.cli:main"
vcp-mcp-server = "vcp.mcp_server:run"

[project.urls]
Homepage = "https://github.com/Creed-Space/VCP-SDK"
Documentation = "https://github.com/Creed-Space/VCP-SDK/tree/main/docs"
Repository = "https://github.com/Creed-Space/VCP-SDK"
Source = "https://github.com/Creed-Space/VCP-SDK/tree/main/python"
Issues = "https://github.com/Creed-Space/VCP-SDK/issues"
Changelog = "https://github.com/Creed-Space/VCP-SDK/blob/main/CHANGELOG.md"
Security = "https://github.com/Creed-Space/VCP-SDK/security/policy"
Support = "https://github.com/Creed-Space/VCP-SDK/discussions"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vcp*"]

[tool.setuptools.package-data]
vcp = ["py.typed", "agent/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["vcp"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/vcp/"]
only_mutate = [
    "src/vcp/privacy.py",
    "src/vcp/revocation.py",
    "src/vcp/identity/token.py",
    "src/vcp/canonicalize.py",
]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = [
    "tests/vcp/test_canonicalize.py",
    "tests/vcp/test_privacy.py",
    "tests/vcp/test_revocation.py",
    "tests/vcp/test_orchestrator_security.py",
    "tests/vcp/identity/test_token.py",
    "tests/vcp/semantics/test_csm1.py",
    "tests/vcp/test_vectors.py",
]
use_setproctitle = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "vcp.adaptation.redis_state"
disallow_untyped_calls = false
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
