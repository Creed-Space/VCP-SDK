[package]
name = "vcp-wasm"
description = "VCP SDK WebAssembly bindings for browser playgrounds"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/Creed-Space/VCP-SDK/tree/main/rust/vcp-wasm"
documentation = "https://docs.rs/vcp-wasm"
keywords = ["context", "protocol", "values", "verification", "wasm"]
categories = ["api-bindings", "encoding", "wasm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vcp-core = { version = "4.2.0", path = "../vcp-core" }
wasm-bindgen = "0.2.126"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"
