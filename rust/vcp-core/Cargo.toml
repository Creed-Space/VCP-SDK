[package]
name = "vcp-core"
description = "Value Context Protocol (VCP) core types and parsing"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/Creed-Space/VCP-SDK/tree/main/rust/vcp-core"
documentation = "https://docs.rs/vcp-core"
keywords = ["context", "protocol", "safety", "values", "verification"]
categories = ["authentication", "encoding", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The 0.23 default enables simd-unsafe. Keep the security-critical codec on the safe std engine.
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
criterion = "=0.8.2"
pretty_assertions = "1"
proptest = "=1.11.0"

[[bench]]
name = "core_performance"
harness = false
