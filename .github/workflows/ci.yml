name: SDK CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository contracts and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webmcp/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install locked tooling and SDK
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install --require-hashes --requirement python/requirements-dev.lock
          python -m pip install --no-deps --editable python
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix webmcp

      - name: Validate repository, schemas, and all checked profiles
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: make validate PYTHON=python

      - name: Audit locked Python and root npm dependencies
        run: |
          python -m pip_audit --requirement python/requirements-dev.lock
          npm audit --audit-level=moderate

      - name: Upload candidate-bound conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-${{ github.sha }}
          path: conformance/reports/
          if-no-files-found: error
          retention-days: 30

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
            quality: false
          - os: ubuntu-24.04
            python-version: "3.11"
            quality: false
          - os: ubuntu-24.04
            python-version: "3.12"
            quality: true
          - os: ubuntu-24.04
            python-version: "3.13"
            quality: false
          - os: ubuntu-24.04
            python-version: "3.14"
            quality: false
          - os: macos-15
            python-version: "3.12"
            quality: false
          - os: windows-2025
            python-version: "3.12"
            quality: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and all optional surfaces
        working-directory: python
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install --editable '.[dev,server,mcp,redis,metrics]'

      - name: Lint
        if: matrix.quality
        working-directory: python
        run: python -m ruff check src tests

      - name: Type check
        if: matrix.quality
        working-directory: python
        run: python -m mypy src/vcp

      - name: Test
        if: ${{ !matrix.quality }}
        working-directory: python
        run: python -m pytest -q

      - name: Test with critical statement and branch floors
        if: matrix.quality
        working-directory: python
        run: |
          python -m pytest -q \
            --cov=vcp \
            --cov-branch \
            --cov-report=json:coverage.json
          python ../scripts/check_critical_coverage.py \
            coverage.json \
            --output critical-coverage.json

      - name: Upload critical coverage evidence
        if: ${{ always() && matrix.quality }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-critical-coverage-${{ github.sha }}
          path: |
            python/coverage.json
            python/critical-coverage.json
          if-no-files-found: error
          retention-days: 30

      - name: Build distributions
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.14'
        working-directory: python
        run: |
          python -m build
          python ../scripts/normalize_python_sdist.py dist/*.tar.gz
          python -m twine check dist/*

  python-extras:
    name: Python optional extra ${{ matrix.extra }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra: [core, server, mcp, redis, metrics, all]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install selected surface
        shell: bash
        run: |
          python -m pip install 'pip==26.2.1'
          if [[ "${{ matrix.extra }}" == "core" ]]; then
            python -m pip install ./python
          elif [[ "${{ matrix.extra }}" == "all" ]]; then
            python -m pip install './python[server,mcp,redis,metrics]'
          else
            python -m pip install "./python[${{ matrix.extra }}]"
          fi

      - name: Smoke selected surface
        run: python scripts/check_optional_extra.py --extra "${{ matrix.extra }}"

  python-lower-bounds:
    name: Python direct lower bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install test tools and exact direct minima
        shell: bash
        run: |
          python -m pip install 'pip==26.2.1' pytest pytest-asyncio httpx hypothesis
          python scripts/lower_bound_requirements.py > /tmp/vcp-lower-bounds.txt
          python -m pip install \
            --constraint /tmp/vcp-lower-bounds.txt \
            --editable 'python[server,mcp,redis,metrics]'
          python -m pip check

      - name: Test supported direct minima
        working-directory: python
        run: python -m pytest -q

      - name: Upload resolved direct-minimum policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-lower-bounds-${{ github.sha }}
          path: /tmp/vcp-lower-bounds.txt
          if-no-files-found: error
          retention-days: 30

  rust:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
            quality: true
          - os: ubuntu-24.04
            toolchain: "1.87.0"
            quality: false
          - os: macos-15
            toolchain: stable
            quality: false
          - os: windows-2025
            toolchain: stable
            quality: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Format
        if: matrix.quality
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Lint
        if: matrix.quality
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        working-directory: rust
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        if: matrix.quality
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify crate packages
        if: matrix.quality
        working-directory: rust
        run: |
          cargo package -p vcp-core --locked
          cargo package -p vcp-cli --locked --config 'patch.crates-io.vcp-core.path="vcp-core"'
          cargo package -p vcp-wasm --locked --config 'patch.crates-io.vcp-core.path="vcp-core"'

      - name: Audit Rust dependencies
        if: matrix.quality
        run: |
          cargo install cargo-audit --locked --version 0.22.0
          cargo audit --file rust/Cargo.lock

  wasm:
    name: Rust WASM target
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust with WASM target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM package target
        working-directory: rust
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo build -p vcp-wasm --target wasm32-unknown-unknown --locked

  installed-artifacts:
    name: Installed artifact verification
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webmcp/package-lock.json

      - name: Set up Rust with WASM target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install artifact tooling
        run: |
          python -m pip install 'pip==26.2.1' 'build==1.3.0' 'twine==7.0.0'
          npm ci --ignore-scripts --prefix webmcp

      - name: Build, install, and smoke every artifact
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: python scripts/verify_artifacts.py

      - name: Upload artifact verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-artifacts-${{ github.sha }}
          path: artifact-evidence/latest.json
          if-no-files-found: error
          retention-days: 30

  webmcp:
    name: WebMCP on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: webmcp/package-lock.json

      - name: Install locked dependencies
        working-directory: webmcp
        run: npm ci --ignore-scripts

      - name: Type check and test
        working-directory: webmcp
        run: |
          npm run check
          npm test

      - name: Build and test packed package
        working-directory: webmcp
        run: npm run test:packed

      - name: Audit dependencies
        working-directory: webmcp
        run: npm audit --audit-level=moderate
