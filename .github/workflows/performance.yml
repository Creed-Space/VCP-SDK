name: Performance regression

on:
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "webmcp/**"
      - "performance/**"
      - "scripts/run_performance.py"
      - ".github/workflows/performance.yml"
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.os }} performance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmcp/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: performance-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install locked dependencies
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install --require-hashes --requirement python/requirements-dev.lock
          python -m pip install --no-deps --editable python
          npm ci --ignore-scripts --prefix webmcp

      - name: Run candidate-bound envelope
        shell: bash
        run: |
          profile=smoke
          if [[ "${{ github.event_name }}" == "schedule" ]]; then profile=full; fi
          mkdir -p performance-results
          python scripts/run_performance.py \
            --profile "$profile" \
            --output "performance-results/${{ runner.os }}-${{ github.sha }}.json"

      - name: Run detailed Rust statistics
        if: github.event_name == 'schedule' && runner.os == 'Linux'
        working-directory: rust
        run: cargo bench -p vcp-core --bench core_performance

      - name: Upload exact-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ runner.os }}-${{ github.sha }}
          path: performance-results/*.json
          if-no-files-found: error
          retention-days: 30
