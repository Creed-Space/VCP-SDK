version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "rust"]
    open-pull-requests-limit: 3
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/rust/fuzz"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "rust", "fuzz"]
    open-pull-requests-limit: 2
    groups:
      rust-fuzz-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "tooling"]
    open-pull-requests-limit: 2
    groups:
      root-tooling-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/webmcp"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "typescript"]
    open-pull-requests-limit: 3
    groups:
      webmcp-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
